<!doctype html>
<meta charset="utf-8">
<title>Sprite sheet player</title>
<style>
  :root { color-scheme: dark; --bg:#14141a; --panel:#1e1e27; --line:#33333f; --ink:#e9e9f0; --dim:#9a9aab; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-wrap:wrap; gap:24px; padding:24px; }
  #stage { background:#2a2a33; border:1px solid var(--line); border-radius:10px; padding:16px;
           display:flex; align-items:center; justify-content:center; min-width:320px; min-height:320px; }
  canvas { image-rendering:pixelated; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px;
           min-width:270px; display:flex; flex-direction:column; gap:14px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim);
          text-transform:uppercase; letter-spacing:.06em; }
  input[type=range] { width:100%; }
  select, button { background:#2a2a36; color:var(--ink); border:1px solid var(--line);
                   border-radius:6px; padding:7px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { background:#343442; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .val { color:var(--ink); font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; }
  #err { color:#ff8f8f; max-width:40ch; }
</style>

<div id="stage"><canvas id="view" width="320" height="320"></canvas></div>

<div class="panel">
  <label>Animation <select id="rowSel"></select></label>
  <div id="meta" style="font-size:12px;color:var(--dim)"></div>
  <label>Speed <span class="val" id="fpsVal"></span>
    <input id="fps" type="range" min="1" max="30" step="1"></label>
  <label>Zoom <span class="val" id="zoomVal"></span>
    <input id="zoom" type="range" min="1" max="6" step="1" value="2"></label>
  <label>Frame <span class="val" id="frameVal"></span>
    <input id="frame" type="range" min="0" step="1"></label>
  <div class="row">
    <button id="play">Pause</button>
    <button id="prev">◀</button>
    <button id="next">▶</button>
  </div>
  <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none">
    <input id="cutbg" type="checkbox" checked style="flex:0"> cut out sheet background</label>
  <div id="err"></div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const err = msg => { $('err').textContent = msg; };

let man, sheet, row, i = 0, playing = true, acc = 0, last = 0;

const loadImage = src => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => res(im);
  im.onerror = () => rej(new Error('could not load ' + src));
  im.src = src;
});

function draw() {
  const cv = $('view'), ctx = cv.getContext('2d');
  const z = +$('zoom').value, [cw, ch] = row.canvas;
  cv.width = cw * z; cv.height = ch * z;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const f = row.frames[i];
  const src = row.image || ($('cutbg').checked ? sheet.keyed : sheet.raw);
  ctx.drawImage(src, f.x, f.y, f.w, f.h, f.dx * z, f.dy * z, f.w * z, f.h * z);
  $('frameVal').textContent = `${i + 1} / ${row.frames.length}`;
  $('frame').value = i;
}

function tick(t) {
  if (playing) {
    acc += t - (last || t);
    const step = 1000 / +$('fps').value;
    while (acc >= step) { acc -= step; i = (i + 1) % row.frames.length; }
  }
  last = t;
  draw();
  requestAnimationFrame(tick);
}

function selectRow(n) {
  row = man.rows[n]; i = 0;
  $('meta').textContent = row.note || '';
  $('cutbg').parentElement.style.display = row.image ? 'none' : '';
  $('frame').max = row.frames.length - 1;
  draw();
}

const step = d => { playing = false; $('play').textContent = 'Play';
                    i = (i + d + row.frames.length) % row.frames.length; draw(); };

$('rowSel').onchange = e => selectRow(+e.target.value);
$('fps').oninput = e => $('fpsVal').textContent = e.target.value + ' fps';
$('zoom').oninput = e => { $('zoomVal').textContent = e.target.value + '×'; draw(); };
$('frame').oninput = e => { playing = false; $('play').textContent = 'Play'; i = +e.target.value; draw(); };
$('cutbg').onchange = draw;
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);

try {
  const src = new URLSearchParams(location.search).get('m') || '../out/frames.json';
  man = await (await fetch(src)).json();

  // A smoothing manifest describes one animation packed into a sprite strip;
  // a slicing manifest describes rows blitted out of the original sheet.
  if (man.strip) {
    const base = src.slice(0, src.lastIndexOf('/') + 1);
    const [w, h] = man.size;
    const image = await loadImage(base + man.strip);
    man = { fps: man.fps, rows: [{
      name: man.name, canvas: man.size, image,
      note: `${new Set(man.poses || []).size || man.source_poses} drawn poses → `
          + `${man.frames} frames, ${man.loop_seconds}s loop`
          + (man.pingpong ? ', ping-pong' : ''),
      frames: Array.from({ length: man.frames }, (_, k) => ({
        x: (k % man.cols) * w, y: Math.floor(k / man.cols) * h, w, h, dx: 0, dy: 0 })),
    }] };
  } else {
  // The slicer already keyed the background out with an edge flood fill, which
  // a per-pixel colour test here could not match: mid-grey shading inside the
  // character would be punched through.
  const [raw, keyed] = await Promise.all([
      loadImage('../assets/' + man.sheet),
      loadImage('../out/' + man.keyed_sheet),
    ]);
    sheet = { raw, keyed };
  }
  $('rowSel').innerHTML = man.rows
    .map((r, n) => `<option value="${n}">${r.name} — ${r.frames.length} frames</option>`).join('');
  $('fps').value = man.fps; $('fpsVal').textContent = man.fps + ' fps';
  $('zoomVal').textContent = $('zoom').value + '×';
  selectRow(0);
  requestAnimationFrame(tick);
} catch (e) {
  err(e.message + ' — run tools/slice_sheet.py first, then serve the repo root with: python3 -m http.server');
}
</script>
